# Kotlin compile daemon memory. The five consecutive OOMs on this branch were
# NOT a heap-sizing problem: the K2 data-flow analyzer blew up heap-independently
# (4g -> 6g -> 8g -> 10g all died with the identical FIR DFA stack
# LogicSystem.addImplication <- exitSafeCall/mergeIncomingFlow) while main
# compiled green at the same merge-base. The 2.1.20 -> 2.1.21 compiler bump is
# the actual fix; these are main's proven-good settings (3g build JVM / 4g
# Kotlin daemon, green on main's push CI), so a green run isolates the compiler
# bump as the only variable.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
android.useAndroidX=true
kotlin.code.style=official
org.gradle.configuration-cache=true
