# CI runners provide 16 GB RAM, and android-ci runs ./gradlew --no-daemon:
# Gradle forks a single-use build JVM whose heap is org.gradle.jvmargs, and
# with org.gradle.configuration-cache=true the Kotlin compilation executes
# IN-PROCESS inside that JVM (GradleCompilerRunnerWithWorkers) — so
# kotlin.daemon.jvmargs does NOT bound compilation; org.gradle.jvmargs does.
# The Kotlin 2 (FIR) data-flow analyzer needs real headroom for this
# codebase's large Compose functions: it OOM'd ("GC overhead limit exceeded"
# in :app:compileDebugKotlin) at 2 GB, then again at 3 GB/4 GB once the
# unified live editor (NoteEditor/NoteEditorPreview/MermaidDiagramView)
# landed. 8 GB covers compile + lint + unit tests in one JVM.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g
android.useAndroidX=true
kotlin.code.style=official
org.gradle.configuration-cache=true
