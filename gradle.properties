# CI runners provide 16 GB RAM. The Kotlin compile daemon is the JVM that
# actually runs :app:compileDebugKotlin (CI logs: GradleCompilerRunnerWithWorkers
# bridging to the daemon; its OOM hint names kotlin.daemon.jvmargs), so THIS is
# the knob that bounds compilation memory — org.gradle.jvmargs only bounds the
# Gradle build JVM (lint, tests, dex). The Kotlin 2 FIR data-flow analyzer plus
# the module-wide symbol tables need real headroom: the daemon OOM'd
# ("GC overhead limit exceeded") at 4g on main's preview rework and at 6g once
# the unified live editor + mermaid + big-audio streaming landed together.
# Both JVMs get a 10g cap: whichever path actually runs the compiler (Kotlin
# daemon, or the Gradle build JVM fallback if the daemon cannot start), the
# compiler has 10g. Live usage peaks ~11-12g, within the 16 GB runner.
org.gradle.jvmargs=-Xmx10g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx10g -XX:MaxMetaspaceSize=1g
android.useAndroidX=true
kotlin.code.style=official
org.gradle.configuration-cache=true
